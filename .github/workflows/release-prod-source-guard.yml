name: Release Prod Source Guard

on:
  pull_request:
    branches:
      - release/prod

jobs:
  only-approved-branches-can-merge-into-release-prod:
    name: Source Branch Policy
    if: github.event_name == 'pull_request' && github.base_ref == 'release/prod'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source branch
        shell: bash
        run: |
          echo "base_ref=${{ github.base_ref }}"
          echo "head_ref=${{ github.head_ref }}"

          if [ "${{ github.base_ref }}" != "release/prod" ]; then
            echo "This workflow only validates PRs targeting release/prod."
            exit 1
          fi

          if [ "${{ github.head_ref }}" = "main" ]; then
            echo "Allowed source branch."
            exit 0
          fi

          if [[ "${{ github.head_ref }}" =~ ^merge/.+-into-release-prod$ ]] || [[ "${{ github.head_ref }}" =~ ^merge/main-into-prod$ ]]; then
            echo "Allowed source branch."
            exit 0
          fi

          echo "Blocked: only PRs from 'main' or bridge branches matching 'merge/*-into-release-prod' can merge into 'release/prod'."
          exit 1
