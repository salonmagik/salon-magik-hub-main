name: Release Prod Source Guard

on:
  pull_request:
    branches:
      - release/prod

jobs:
  block-all-prs:
    name: Block Direct PRs to release/prod
    runs-on: ubuntu-latest
    steps:
      - name: Fail — release/prod is CI-only
        run: |
          echo "❌ PRs targeting release/prod are not allowed."
          echo ""
          echo "release/prod is a read-only record of what is deployed in production."
          echo "It is advanced exclusively by the 'Deploy Production' workflow"
          echo "after a successful deploy (migrations → edge functions → frontend)."
          echo ""
          echo "To ship to production:"
          echo "  1. Merge your changes into main"
          echo "  2. Trigger the Deploy Production workflow from main"
          echo "  3. On success, CI will advance release/prod automatically"
          exit 1
